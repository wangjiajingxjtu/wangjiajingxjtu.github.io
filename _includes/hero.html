<div class="hero" id="top">
  <img class="hero-image" src="{{ site.hero_image | relative_url }}" alt="" fetchpriority="high" width="1800" height="600">
  <div>
    <h1>{{ site.title | escape }}</h1>
    <hr class="hero-rule">
    <p class="subtitle">{{ site.subtitle | escape }}</p>
    <p class="hero-cn" lang="zh-CN">{{ site.subtitle_zh | escape }}</p>
  </div>
</div>
