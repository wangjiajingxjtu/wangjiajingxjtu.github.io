---
layout: default
---
<header class="page-header" id="top">
  <h1>{{ page.title | escape }}</h1>
  <p class="post-date"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%B %-d, %Y' }}</time></p>
</header>
<main class="page-content" id="main-content" tabindex="-1">
  <article>{{ content }}</article>
  <p class="back-link"><a href="{{ '/news/' | relative_url }}">← All news</a></p>
</main>
